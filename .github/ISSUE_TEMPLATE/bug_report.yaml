name: 'Bug Report 🐛'
description: Report an issue.
title: '[BUG]: '
labels: 'type: Bug'
body:
  - type: markdown
    attributes:
      value: '## Welcome!'
  - type: markdown
    attributes:
      value:
        Thanks for taking the time to fill out this bug report. 
  - type: dropdown
    id: project
    attributes:
      label: Project
      description: What project are working with? 
      multiple: true
      options: 
        - 'ibm.com/able site'
        - 'Rules (accessibility-checker-engine)'
        - 'Accessibility Checker browser extension'
        - 'Screen Reader Simulator browser extension'
        - 'accessibility-checker for Node'
        - 'cypress-accessibility-checker'
        - 'karma-accessibility-checker'
        - 'other'
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser(s) are you experiencing the issue with?
      multiple: true
      options:
        - Chrome
        - Safari
        - Firefox
  - type: textarea
    id: description
    attributes:
      label: Description
      description:
        "Tell us more about the issue that you're experiencing and how to reproduce it"
      placeholder: What did you expect to happen? What happened instead?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Definition of Done
        (DO NOT EDIT THIS SECTION. This section is for IBM internal use only.)
        - [ ] Design artifacts reviewed
        - [ ] Work item implemented
        - [ ] Automated test case created (when applicable)
        - [ ] Unit test completed
        - [ ] Run Checker (when applicable)
        - [ ] Manual and Screen Reader Testing (when applicable)
        - [ ] Video recording of user experience walkthrough (if impact to UX)
        - [ ] PR created      
          
  
