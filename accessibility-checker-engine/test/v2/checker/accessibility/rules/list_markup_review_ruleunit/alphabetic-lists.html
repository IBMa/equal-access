<html lang="en">
<head>
    <title>Alphabetic Lists Test</title>
</head>
<body>
    <h1>Alphabetic Lists Test</h1>
    
    <!-- Test 1: Lowercase letters with period -->
    <div id="test1">
        a. First option<br>
        b. Second option<br>
        c. Third option
    </div>
    
    <!-- Test 2: Lowercase letters with parenthesis -->
    <p id="test2">
        a) Option A<br>
        b) Option B<br>
        c) Option C
    </p>
    
    <!-- Test 3: Uppercase letters with period -->
    <section id="test3">
        A. Point one<br>
        B. Point two<br>
        C. Point three
    </section>
    
    <!-- Test 4: Uppercase letters with parenthesis -->
    <div id="test4">
        A) Item A<br>
        B) Item B<br>
        C) Item C
    </div>
    
    <!-- Test 5: Letters with parentheses (a) -->
    <div id="test5">
        (a) First item<br>
        (b) Second item<br>
        (c) Third item
    </div>
    
    <!-- Test 6: Mixed case should still work -->
    <div id="test6">
        a. Lower case<br>
        B. Upper case<br>
        c. Lower again
    </div>
