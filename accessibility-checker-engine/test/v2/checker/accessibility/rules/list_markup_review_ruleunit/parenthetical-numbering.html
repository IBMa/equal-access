<html lang="en">
<head>
    <title>Parenthetical Numbering Test</title>
</head>
<body>
    <h1>Parenthetical Numbering Test</h1>
    
    <!-- Test 1: Numbers with parentheses (1) -->
    <div id="test1">
        (1) First item<br>
        (2) Second item<br>
        (3) Third item
    </div>
    
    <!-- Test 2: Numbers with closing parenthesis 1) -->
    <p id="test2">
        1) Option A<br>
        2) Option B<br>
        3) Option C
    </p>
    
    <!-- Test 3: Numbers with period and closing paren 1.) -->
    <section id="test3">
        1.) Point one<br>
        2.) Point two<br>
        3.) Point three
    </section>
    
    <!-- Test 4: Multi-digit numbers -->
    <div id="test4">
        (10) Item ten<br>
        (11) Item eleven<br>
        (12) Item twelve
    </div>
    
    <!-- Test 5: Mixed with inline formatting -->
    <div id="test5">
        (1) <strong>Bold</strong> item<br>
        (2) <em>Italic</em> item<br>
        (3) <span>Span</span> item
    </div>
