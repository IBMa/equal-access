<body>
    <h1>Table Cells with Lists Test</h1>
    
    <!-- Test 1: Table cell with numbered list -->
    <table>
        <tr>
            <td id="test1">
                1. First feature<br>
                2. Second feature<br>
                3. Third feature
            </td>
        </tr>
    </table>
    
    <!-- Test 2: Table cell with bullet list -->
    <table>
        <tr>
            <td id="test2">
                • Feature A<br>
                • Feature B<br>
                • Feature C
            </td>
        </tr>
    </table>
    
    <!-- Test 3: Table header with list -->
    <table>
        <tr>
            <th id="test3">
                a. Option one<br>
                b. Option two<br>
                c. Option three
            </th>
        </tr>
    </table>
    
    <!-- Test 4: Multiple cells with lists -->
    <table>
        <tr>
            <td id="test4a">
                * Item 1<br>
                * Item 2
            </td>
            <td id="test4b">
                - Point A<br>
                - Point B
            </td>
        </tr>
    </table>
    
    <!-- Test 5: Table cell with newline-separated list -->
    <table>
        <tr>
            <td id="test5">
                1. First item
                2. Second item
                3. Third item
            </td>
        </tr>
    </table>
