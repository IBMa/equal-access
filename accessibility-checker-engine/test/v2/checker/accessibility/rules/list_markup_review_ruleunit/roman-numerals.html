<head>
    <title>Roman Numerals Test</title>
</head>
<body>
    <h1>Roman Numerals Test</h1>
    
    <!-- Test 1: Lowercase Roman numerals with period -->
    <div id="test1">
        i. First point<br>
        ii. Second point<br>
        iii. Third point
    </div>
    
    <!-- Test 2: Lowercase Roman numerals with parenthesis -->
    <p id="test2">
        i) Option A<br>
        ii) Option B<br>
        iii) Option C
    </p>
    
    <!-- Test 3: Uppercase Roman numerals -->
    <section id="test3">
        I. Point one<br>
        II. Point two<br>
        III. Point three
    </section>
    
    <!-- Test 4: Roman numerals iv, v, vi -->
    <div id="test4">
        iv. Item four<br>
        v. Item five<br>
        vi. Item six
    </div>
    
    <!-- Test 5: Roman numerals with parentheses (i) -->
    <div id="test5">
        (i) First item<br>
        (ii) Second item<br>
        (iii) Third item
    </div>
