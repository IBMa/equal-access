<html lang="en">
<head>
    <title>Newline-Separated Lists Test</title>
</head>
<body>
    <h1>Newline-Separated Lists Test</h1>
    
    <!-- Test 1: Newline-separated bullets (no <br>) -->
    <div id="test1">
        * Item one
        * Item two
        * Item three
    </div>
    
    <!-- Test 2: Newline-separated numbers -->
    <p id="test2">
        1. First point
        2. Second point
        3. Third point
    </p>
    
    <!-- Test 3: Newline-separated with inline elements -->
    <div id="test3">
        * <strong>Bold</strong> item
        * <em>Italic</em> item
        * <span>Span</span> item
    </div>
    
    <!-- Test 4: Mixed newlines and <br> -->
    <section id="test4">
        a. Option A
        b. Option B<br>
        c. Option C
    </section>
    
    <!-- Test 5: Newline-separated Unicode bullets -->
    <div id="test5">
        • First item
        • Second item
        • Third item
    </div>
    
    <!-- Test 6: Newline-separated Roman numerals -->
    <div id="test6">
        i. Point one
        ii. Point two
        iii. Point three
    </div>
