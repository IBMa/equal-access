<head>
    <title>Unicode Bullets Test</title>
</head>
<body>
    <h1>Unicode Bullets Test</h1>
    
    <!-- Test 1: Bullet • -->
    <div id="test1">
        • First item<br>
        • Second item<br>
        • Third item
    </div>
    
    <!-- Test 2: White bullet ◦ -->
    <p id="test2">
        ◦ Option A<br>
        ◦ Option B<br>
        ◦ Option C
    </p>
    
    <!-- Test 3: Black square ▪ -->
    <section id="test3">
        ▪ Point one<br>
        ▪ Point two<br>
        ▪ Point three
    </section>
    
    <!-- Test 4: Right-pointing triangle ▸ -->
    <div id="test4">
        ▸ Item A<br>
        ▸ Item B<br>
        ▸ Item C
    </div>
    
    <!-- Test 5: Checkmarks ✓ and ✗ -->
    <div id="test5">
        ✓ Completed task<br>
        ✓ Another completed task<br>
        ✗ Failed task
    </div>
    
    <!-- Test 6: Em dash — -->
    <p id="test6">
        — First point<br>
        — Second point<br>
        — Third point
    </p>
    
    <!-- Test 7: En dash – -->
    <div id="test7">
        – Item one<br>
        – Item two<br>
        – Item three
    </div>
