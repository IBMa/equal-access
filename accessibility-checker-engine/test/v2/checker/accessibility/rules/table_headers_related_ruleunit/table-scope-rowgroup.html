    <h2>Test case: table-scope-rowgroup.html</h2>

    <p>A complex table using scope="rowgroup" on spanning row-group headers must not trigger a violation.</p>

    <!-- Valid: th with scope="rowgroup" spans multiple rows; data cells use headers attribute -->
    <table id="valid-rowgroup">
        <thead>
            <tr>
                <th scope="col" id="rg-name">Name</th>
                <th scope="col" id="rg-score">Score</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="2" id="rg-group-a">Group A</th>
                <th scope="row" id="rg-alice">Alice</th>
                <td headers="rg-group-a rg-alice rg-score">90</td>
            </tr>
            <tr>
                <th scope="row" id="rg-bob">Bob</th>
                <td headers="rg-group-a rg-bob rg-score">85</td>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="2" id="rg-group-b">Group B</th>
                <th scope="row" id="rg-carol">Carol</th>
                <td headers="rg-group-b rg-carol rg-score">92</td>
            </tr>
            <tr>
                <th scope="row" id="rg-dave">Dave</th>
                <td headers="rg-group-b rg-dave rg-score">88</td>
            </tr>
        </tbody>
    </table>
